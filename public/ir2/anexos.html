<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anexos DGII</title><style>body{margin:0;background:#070d1a;color:#e8f0ff;font:13px system-ui;padding:18px}.head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.head a,button{background:#0f1e38;border:1px solid #285a9c;color:#80b8ff;border-radius:7px;padding:7px 11px;text-decoration:none;cursor:pointer}select,input{background:#0f1e38;color:#e8f0ff;border:1px solid #285a9c;border-radius:6px;padding:7px}.card{margin-top:16px;background:#0f1e38;border:1px solid #285a9c;border-radius:10px;padding:14px}table{width:100%;border-collapse:collapse;margin-top:10px}td,th{padding:7px;border-bottom:1px solid #1b365d;text-align:left}input{width:95%}.hint{color:#7a9bc0}</style><body><div class="head"><a href="/ir2/resumen.html">← Datos DGII</a><strong>Anexos DGII</strong><span id="empresa"></span></div><div class="card"><label>Anexo del IR-2: <select id="anexo" onchange="render()"></select></label><p class="hint">Plantilla para registrar la información del anexo seleccionado. Los anexos se toman del libro IR-2 de referencia.</p><button onclick="add()">+ Agregar fila</button><table><thead><tr><th>Concepto</th><th>Referencia / Identificador</th><th>Monto</th><th>Observación</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><script>const anexos=['D-2','D-1','D','A-1','A-2','A-3','B-1','B-2','B-3','B-4','E','H-1','H-2','G','J','IR-2','Activo'];const q=new URLSearchParams(location.search),key='save-anexos-'+(q.get('rnc')||'nuevo')+'-'+(q.get('anio')||new Date().getFullYear());let data=JSON.parse(localStorage.getItem(key)||'{}');document.getElementById('empresa').textContent=[q.get('nombre'),q.get('rnc'),q.get('anio')].filter(Boolean).join(' · ');document.getElementById('anexo').innerHTML=anexos.map(x=>`<option>${x}</option>`).join('');function save(){localStorage.setItem(key,JSON.stringify(data))}function render(){const a=anexo.value,r=data[a]||[];rows.innerHTML=r.length?r.map((x,i)=>`<tr><td><input value="${x.c||''}" oninput="u(${i},'c',this.value)"></td><td><input value="${x.r||''}" oninput="u(${i},'r',this.value)"></td><td><input type="number" value="${x.m||''}" oninput="u(${i},'m',this.value)"></td><td><input value="${x.o||''}" oninput="u(${i},'o',this.value)"></td><td><button onclick="d(${i})">×</button></td></tr>`).join(''):'<tr><td colspan="5" class="hint">Sin información registrada.</td></tr>'}function add(){const a=anexo.value;(data[a]||(data[a]=[])).push({c:'',r:'',m:'',o:''});save();render()}function u(i,f,v){data[anexo.value][i][f]=v;save()}function d(i){data[anexo.value].splice(i,1);save();render()}render();</script></body></html>
