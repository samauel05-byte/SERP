<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NALA</title>
<style>
  :root {
    --bg: #f8f9fa;
    --surface: #ffffff;
    --border: #e5e7eb;
    --text: #111827;
    --muted: #6b7280;
    --accent: #10b981;
    --accent-dark: #065f46;
    --user-bg: linear-gradient(135deg,#065f46,#10b981);
    --bot-bg: #ffffff;
    --input-bg: #ffffff;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2d3148;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --bot-bg: #1a1d27;
      --input-bg: #1a1d27;
      --shadow: 0 1px 3px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2d3148;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --bot-bg: #1a1d27;
    --input-bg: #1a1d27;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Messages area */
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  /* Welcome screen */
  #welcome {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 14px;
    padding: 24px;
    text-align: center;
  }
  .welcome-icon {
    width: 64px; height: 64px; border-radius: 18px;
    background: linear-gradient(135deg,#065f46,#10b981);
    display: flex; align-items: center; justify-content: center;
  }
  .welcome-icon svg { color: #fff; }
  .welcome-title { font-size: 22px; font-weight: 800; }
  .welcome-sub { font-size: 13px; color: var(--muted); max-width: 280px; line-height: 1.5; }
  .suggestions { display: flex; flex-direction: column; gap: 8px; width: 100%; max-width: 360px; margin-top: 6px; }
  .sug-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    text-align: left;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .sug-btn:hover { border-color: var(--accent); background: rgba(16,185,129,.06); }

  /* Message bubbles */
  .msg { display: flex; gap: 10px; max-width: 100%; }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 30px; height: 30px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; font-size: 13px; font-weight: 700;
  }
  .msg.bot .msg-avatar { background: linear-gradient(135deg,#065f46,#10b981); color:#fff; }
  .msg.user .msg-avatar { background: #e5e7eb; color: var(--text); font-size: 11px; }
  .msg-bubble {
    max-width: calc(100% - 44px);
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.6;
    box-shadow: var(--shadow);
  }
  .msg.bot .msg-bubble { background: var(--bot-bg); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; }
  .msg.user .msg-bubble { background: var(--user-bg); color: #fff; border-radius: 14px 4px 14px 14px; }
  .msg-bubble pre {
    background: rgba(0,0,0,.08);
    border-radius: 6px;
    padding: 8px;
    margin: 6px 0;
    overflow-x: auto;
    font-size: 12px;
    white-space: pre-wrap;
  }
  .msg.user .msg-bubble pre { background: rgba(255,255,255,.15); }

  /* Typing indicator */
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }

  /* Input area */
  #input-area {
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }
  #user-input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
    color: var(--text);
    resize: none;
    outline: none;
    max-height: 120px;
    min-height: 42px;
    font-family: inherit;
    transition: border-color .15s;
  }
  #user-input:focus { border-color: var(--accent); }
  #user-input::placeholder { color: var(--muted); }
  #send-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg,#065f46,#10b981);
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity .15s;
  }
  #send-btn:hover { opacity: .85; }
  #send-btn:disabled { opacity: .4; cursor: not-allowed; }
  #send-btn svg { color: #fff; }

  /* Error */
  .error-msg { background: #fef2f2; border: 1px solid #fecaca; border-radius: 10px; padding: 10px 14px; font-size: 13px; color: #dc2626; }
</style>
</head>
<body>

<div id="messages">
  <div id="welcome">
    <div class="welcome-icon">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div class="welcome-title">NALA</div>
    <div class="welcome-sub">Asistente de contabilidad dominicana. Pregúntame sobre ITBIS, 606/607, TSS, DGII y más.</div>
    <div class="suggestions">
      <button class="sug-btn" onclick="suggest('¿Cómo se calcula el ITBIS en República Dominicana?')">¿Cómo se calcula el ITBIS?</button>
      <button class="sug-btn" onclick="suggest('¿Qué es el formulario 606 y cuándo se presenta?')">¿Qué es el formulario 606?</button>
      <button class="sug-btn" onclick="suggest('¿Cuáles son las tasas de retención del ISR?')">Tasas de retención del ISR</button>
      <button class="sug-btn" onclick="suggest('¿Cómo pagar la TSS de los empleados?')">¿Cómo pagar la TSS?</button>
    </div>
  </div>
</div>

<div id="input-area">
  <textarea id="user-input" placeholder="Escribe tu pregunta..." rows="1"></textarea>
  <button id="send-btn" onclick="sendMessage()" title="Enviar">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
  </button>
</div>

<script>
  const msgContainer = document.getElementById('messages');
  const welcomeEl = document.getElementById('welcome');
  const inputEl = document.getElementById('user-input');
  const sendBtn = document.getElementById('send-btn');

  let history = [];
  let sending = false;

  // Auto-resize textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  function suggest(text) {
    inputEl.value = text;
    sendMessage();
  }

  function formatText(text) {
    return text
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
      .replace(/```([\s\S]*?)```/g, '<pre>$1</pre>')
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\n/g, '<br>');
  }

  function addMsg(role, text) {
    if (welcomeEl) welcomeEl.remove();
    const msg = document.createElement('div');
    msg.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = role === 'bot' ? 'N' : 'Tú';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    if (role === 'bot') {
      bubble.innerHTML = formatText(text);
    } else {
      bubble.textContent = text;
    }

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    msgContainer.appendChild(msg);
    msgContainer.scrollTop = msgContainer.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const msg = document.createElement('div');
    msg.className = 'msg bot';
    msg.id = 'typing-msg';

    const avatar = document.createElement('div');
    avatar.className = 'msg-avatar';
    avatar.textContent = 'N';

    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';

    if (welcomeEl && welcomeEl.parentNode) welcomeEl.remove();

    msg.appendChild(avatar);
    msg.appendChild(bubble);
    msgContainer.appendChild(msg);
    msgContainer.scrollTop = msgContainer.scrollHeight;
    return msg;
  }

  async function sendMessage() {
    if (sending) return;
    const text = inputEl.value.trim();
    if (!text) return;

    sending = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';

    addMsg('user', text);
    history.push({ role: 'user', content: text });

    const typingEl = addTyping();

    try {
      const res = await fetch('/api/nala/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages: history }),
      });

      typingEl.remove();

      if (!res.ok) {
        const err = await res.json().catch(() => ({ error: 'Error del servidor' }));
        const errDiv = document.createElement('div');
        errDiv.className = 'error-msg';
        errDiv.textContent = 'Error: ' + (err.error || res.status);
        msgContainer.appendChild(errDiv);
      } else {
        const data = await res.json();
        const reply = data.reply || '';
        addMsg('bot', reply);
        history.push({ role: 'assistant', content: reply });
      }
    } catch (e) {
      typingEl.remove();
      const errDiv = document.createElement('div');
      errDiv.className = 'error-msg';
      errDiv.textContent = 'Error de conexión: ' + e.message;
      msgContainer.appendChild(errDiv);
    }

    sending = false;
    sendBtn.disabled = false;
    inputEl.focus();
    msgContainer.scrollTop = msgContainer.scrollHeight;
  }
</script>
</body>
</html>
