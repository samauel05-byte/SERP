<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NALA — 606 / 607</title>
<style>
  :root {
    --bg: #f8f9fc;
    --surface: #ffffff;
    --border: #e4e7ef;
    --text: #111827;
    --muted: #6b7280;
    --accent: #7c3aed;
    --accent-dark: #5b21b6;
    --accent-light: rgba(124,58,237,.08);
    --shadow: 0 1px 6px rgba(0,0,0,.06);
    --shadow-md: 0 4px 16px rgba(0,0,0,.08);
    --user-bg: #7c3aed;
    --bot-bg: #ffffff;
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#0f1117;--surface:#1a1d27;--border:#252836;
    --text:#f1f3f9;--muted:#8b92a5;--accent-light:rgba(124,58,237,.12);
    --shadow:0 1px 6px rgba(0,0,0,.25);--shadow-md:0 4px 16px rgba(0,0,0,.3);
    --bot-bg:#1a1d27;
  }}
  :root[data-theme="dark"]{
    --bg:#0f1117;--surface:#1a1d27;--border:#252836;
    --text:#f1f3f9;--muted:#8b92a5;--accent-light:rgba(124,58,237,.12);
    --shadow:0 1px 6px rgba(0,0,0,.25);--shadow-md:0 4px 16px rgba(0,0,0,.3);
    --bot-bg:#1a1d27;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* Header */
  .header{
    display:flex;align-items:center;gap:10px;
    padding:10px 16px;background:var(--surface);
    border-bottom:1px solid var(--border);
    box-shadow:var(--shadow);flex-shrink:0;
  }
  .header-logo{
    width:36px;height:36px;border-radius:10px;
    background:linear-gradient(135deg,var(--accent-dark),var(--accent));
    display:flex;align-items:center;justify-content:center;
    font-size:16px;font-weight:900;color:#fff;flex-shrink:0;
  }
  .header-text h1{font-size:14px;font-weight:700;line-height:1.2}
  .header-text p{font-size:11px;color:var(--muted)}

  /* Messages */
  .messages{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}

  /* Welcome card */
  .welcome{
    max-width:440px;width:100%;margin:0 auto;
    border-radius:20px;overflow:hidden;
    border:1px solid var(--border);box-shadow:var(--shadow-md);
  }
  .welcome-hero{
    background:linear-gradient(135deg,#5b21b6,#7c3aed,#6d28d9);
    padding:28px 20px;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  .welcome-icon{
    width:60px;height:60px;border-radius:16px;
    background:rgba(255,255,255,.15);
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
  }
  .welcome-hero h2{font-size:18px;font-weight:800;color:#fff}
  .welcome-hero p{font-size:12px;color:rgba(255,255,255,.75)}
  .welcome-steps{background:var(--surface);padding:18px}
  .welcome-steps .label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.7px;margin-bottom:12px;text-align:center}
  .step{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px;color:var(--text)}
  .step-icon{width:32px;height:32px;border-radius:10px;background:var(--accent-light);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px}

  /* Message bubble */
  .msg{display:flex;align-items:flex-end;gap:8px;max-width:100%}
  .msg.user{flex-direction:row-reverse}
  .msg-av{
    width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;flex-shrink:0;overflow:hidden;
  }
  .msg.bot .msg-av{background:linear-gradient(135deg,var(--accent-dark),var(--accent));color:#fff;font-weight:700}
  .msg.user .msg-av{background:#374151;color:#fff}
  .bubble{
    max-width:80%;padding:10px 14px;border-radius:16px;
    font-size:13px;line-height:1.6;box-shadow:var(--shadow);
  }
  .msg.bot .bubble{background:var(--bot-bg);border:1px solid var(--border);border-bottom-left-radius:4px}
  .msg.user .bubble{background:var(--user-bg);color:#fff;border-bottom-right-radius:4px}
  .bubble a{color:inherit;text-decoration:underline}
  .bubble strong{font-weight:700}

  /* Progress bubble */
  .progress-card{
    background:var(--accent-light);border:1px solid rgba(124,58,237,.2);
    border-radius:12px;padding:10px 14px;font-size:12px;
  }
  .progress-bar-track{height:4px;background:rgba(124,58,237,.2);border-radius:4px;margin-top:8px}
  .progress-bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:.3s}

  /* Result card */
  .result-card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:16px;overflow:hidden;min-width:260px;max-width:340px;
  }
  .result-card-header{
    background:linear-gradient(135deg,var(--accent-dark),var(--accent));
    padding:10px 14px;display:flex;align-items:center;gap:8px;
  }
  .result-card-header h3{font-size:13px;font-weight:700;color:#fff}
  .result-card-header .badge{
    font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;
    background:rgba(255,255,255,.2);color:#fff;
  }
  .result-fields{padding:10px 14px;display:flex;flex-direction:column;gap:4px}
  .result-field{display:flex;justify-content:space-between;gap:8px;font-size:11px}
  .result-field .label{color:var(--muted);white-space:nowrap}
  .result-field .value{font-weight:600;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
  .result-actions{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap}
  .dl-btn{
    flex:1;min-width:80px;padding:7px 10px;border-radius:8px;
    font-size:11px;font-weight:700;border:none;cursor:pointer;
    transition:.15s;text-align:center;
  }
  .dl-xlsx{background:var(--accent);color:#fff}
  .dl-xlsx:hover{opacity:.88}
  .dl-txt{background:var(--bg);border:1px solid var(--border);color:var(--text)}
  .dl-txt:hover{border-color:var(--accent);color:var(--accent)}

  /* Typing indicator */
  .typing{display:flex;gap:4px;padding:4px 0}
  .typing span{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:bop 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}
  .typing span:nth-child(3){animation-delay:.4s}
  @keyframes bop{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-5px)}}

  /* Error */
  .error-msg{
    background:#fef2f2;border:1px solid #fca5a5;border-radius:12px;
    padding:8px 12px;font-size:12px;color:#b91c1c;
  }
  @media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .error-msg{background:#450a0a20;border-color:#b91c1c40;color:#f87171}}
  :root[data-theme="dark"] .error-msg{background:#450a0a20;border-color:#b91c1c40;color:#f87171}

  /* File preview */
  .files-preview{
    background:var(--accent-light);border-radius:10px;
    padding:6px 10px;font-size:11px;color:var(--text);
    display:flex;align-items:center;gap:6px;margin-bottom:6px;
    flex-wrap:wrap;
  }
  .files-preview .clear{margin-left:auto;color:#ef4444;cursor:pointer;font-weight:700;border:none;background:none;font-size:11px}

  /* Input area */
  .input-area{
    background:var(--surface);border-top:1px solid var(--border);
    padding:10px 14px;flex-shrink:0;
  }
  .mode-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
  .mode-label{font-size:11px;color:var(--muted);white-space:nowrap;font-weight:500}
  .mode-pill{
    padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;
    border:1px solid var(--border);color:var(--muted);cursor:pointer;
    background:none;transition:.15s;white-space:nowrap;
  }
  .mode-pill.active-606{border-color:#0284c7;background:#0284c7;color:#fff}
  .mode-pill.active-607{border-color:#059669;background:#059669;color:#fff}
  .mode-pill.active-IR17{border-color:#d97706;background:#d97706;color:#fff}
  .mode-pill:hover:not(.active-606):not(.active-607):not(.active-IR17){border-color:var(--accent);color:var(--accent)}
  .input-row{display:flex;gap:8px;align-items:center}
  .attach-btn{
    width:38px;height:38px;border-radius:50%;border:1.5px dashed var(--border);
    background:none;color:var(--muted);cursor:pointer;font-size:18px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:.15s;
  }
  .attach-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light)}
  #chat-input{
    flex:1;background:var(--bg);border:1px solid var(--border);
    border-radius:20px;padding:8px 14px;font-size:13px;color:var(--text);
    font-family:inherit;outline:none;resize:none;max-height:80px;min-height:36px;
    transition:.15s;line-height:1.4;
  }
  #chat-input:focus{border-color:var(--accent)}
  #chat-input::placeholder{color:var(--muted)}
  .send-btn{
    width:38px;height:38px;border-radius:50%;border:none;
    background:linear-gradient(135deg,var(--accent-dark),var(--accent));
    color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;transition:.15s;
  }
  .send-btn:hover{opacity:.88}
  .send-btn:disabled{opacity:.4;cursor:not-allowed}
  .send-btn.stop{background:linear-gradient(135deg,#dc2626,#ef4444)}
  #file-input,#cam-input{display:none}

  /* Drag overlay */
  .drag-overlay{
    position:fixed;inset:0;z-index:50;
    display:none;align-items:center;justify-content:center;
    background:rgba(124,58,237,.12);backdrop-filter:blur(4px);
    border:3px dashed var(--accent);
  }
  .drag-overlay.show{display:flex}
  .drag-overlay p{
    background:var(--accent);color:#fff;
    padding:14px 24px;border-radius:16px;font-size:15px;font-weight:700;
  }
</style>
</head>
<body>

<div class="drag-overlay" id="drag-overlay">
  <p>📥 Suelta las facturas aquí</p>
</div>

<header class="header">
  <div class="header-logo">N</div>
  <div class="header-text">
    <h1>NALA — Núcleo Automatizado de Listados Administrativos</h1>
    <p>Automatiza la preparación de información para la DGII</p>
  </div>
</header>

<div class="messages" id="messages"></div>

<div class="input-area">
  <div class="mode-pills">
    <span class="mode-label">Leer factura como:</span>
    <button class="mode-pill" data-mode="606" onclick="toggleMode('606')">🛒 Compra (606)</button>
    <button class="mode-pill" data-mode="607" onclick="toggleMode('607')">💰 Venta (607)</button>
    <button class="mode-pill" data-mode="IR17" onclick="toggleMode('IR17')">🏦 Retención (IR-17)</button>
  </div>
  <div id="files-preview" style="display:none"></div>
  <div class="input-row">
    <button class="attach-btn" title="Adjuntar archivo" onclick="document.getElementById('file-input').click()">📎</button>
    <button class="attach-btn" title="Cámara" onclick="document.getElementById('cam-input').click()">📷</button>
    <textarea id="chat-input" placeholder="Adjunta una factura o haz una pregunta sobre 606/607…" rows="1"></textarea>
    <button class="send-btn" id="send-btn" onclick="handleSend()" title="Enviar">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
  <input type="file" id="file-input" multiple accept="image/*,application/pdf" onchange="addFiles(this.files)">
  <input type="file" id="cam-input" accept="image/*" capture="environment" onchange="addFiles(this.files)">
</div>

<script src="/cami/vendor/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ── PDF.js ──────────────────────────────────────────────────────────────────
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc = '/cami/vendor/pdf.worker.min.js';
}

// ── State ───────────────────────────────────────────────────────────────────
let mode = null;        // '606' | '607' | 'IR17' | null
let pendingFiles = [];  // {file, name, kind}
let chatHistory = [];   // [{role, content}]
let busy = false;
let results606 = [];    // accumulated 606 records
let results607 = [];    // accumulated 607 records

// ── Mode selection ──────────────────────────────────────────────────────────
function toggleMode(m) {
  mode = mode === m ? null : m;
  document.querySelectorAll('.mode-pill').forEach(el => {
    el.className = 'mode-pill' + (mode && el.dataset.mode === mode ? ' active-' + mode : '');
  });
}

// ── Files ───────────────────────────────────────────────────────────────────
function addFiles(fileList) {
  [...fileList].forEach(f => {
    const isImg = f.type.startsWith('image/');
    const isPdf = f.type === 'application/pdf' || f.name.endsWith('.pdf');
    if (!isImg && !isPdf) return;
    if (!pendingFiles.find(p => p.name === f.name && p.file.size === f.size)) {
      pendingFiles.push({ file: f, name: f.name, kind: isPdf ? 'pdf' : 'img' });
    }
  });
  renderFilesPreview();
}

function renderFilesPreview() {
  const el = document.getElementById('files-preview');
  if (!pendingFiles.length) { el.style.display = 'none'; return; }
  const names = pendingFiles.map(f => `📄 ${f.name}`).join(' · ');
  el.style.display = 'flex';
  el.className = 'files-preview';
  el.innerHTML = `<span>${pendingFiles.length} archivo(s): ${names.slice(0, 80)}${names.length > 80 ? '…' : ''}</span><button class="clear" onclick="clearFiles()">Quitar</button>`;
}

function clearFiles() {
  pendingFiles = [];
  document.getElementById('file-input').value = '';
  document.getElementById('cam-input').value = '';
  renderFilesPreview();
}

// ── Message rendering ────────────────────────────────────────────────────────
function appendMsg(role, html, asHtml = false) {
  const msgs = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = `msg ${role}`;
  const content = asHtml ? html : escHtml(html).replace(/\n/g, '<br>');
  d.innerHTML = `
    <div class="msg-av">${role === 'bot' ? 'N' : '🙂'}</div>
    <div class="bubble">${content}</div>`;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
  return d;
}

function escHtml(t) {
  return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
}

function showTyping() {
  const msgs = document.getElementById('messages');
  const d = document.createElement('div');
  d.className = 'msg bot'; d.id = 'typing-indicator';
  d.innerHTML = `<div class="msg-av">N</div><div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

function showWelcome() {
  const msgs = document.getElementById('messages');
  msgs.innerHTML = `
  <div style="display:flex;justify-content:center">
    <div class="welcome">
      <div class="welcome-hero">
        <div class="welcome-icon">📊</div>
        <h2>NALA</h2>
        <p>Núcleo Automatizado de Listados Administrativos</p>
      </div>
      <div class="welcome-steps">
        <p class="label">Cómo funciona</p>
        <div class="step"><div class="step-icon">🛒</div>Elige: Compras (606), Ventas (607) o Retenciones ISR (IR-17)</div>
        <div class="step"><div class="step-icon">📎</div>Adjunta fotos o PDFs de las facturas</div>
        <div class="step"><div class="step-icon">⚡</div>NALA las lee y extrae todos los campos DGII</div>
        <div class="step"><div class="step-icon">📊</div>Descarga el Excel y TXT listos para la DGII</div>
      </div>
    </div>
  </div>`;
}

// ── Excel / TXT generation ───────────────────────────────────────────────────
const COLS_606 = [
  ['lineas','Líneas'], ['proveedor','Proveedor'], ['rncCedula','RNC o Cédula'],
  ['tipoBienesServicios','Tipo Bienes y Servicios Comprados'], ['ncf','NCF'],
  ['ncfModificado','NCF ó Documento Modificado'], ['fechaComprobante','Fecha Comprobante'],
  ['diaComprobante','Dia Comprobante'], ['fechaPago','Fecha Pago'], ['diaPago','Dia Pago'],
  ['montoFacturadoServicios','Monto Facturado en Servicios'],
  ['montoFacturadoBienes','Monto Facturado en Bienes'],
  ['totalMontoFacturado','Total Monto Facturado'], ['itbisFacturado','ITBIS Facturado'],
  ['itbisRetenido','ITBIS Retenido'], ['itbisProporcionalidad','ITBIS sujeto a Proporcionalidad (Art. 349)'],
  ['itbisLlevadoCosto','ITBIS llevado al Costo'], ['itbisPorAdelantar','ITBIS por Adelantar'],
  ['itbisPercibidoCompras','ITBIS percibido en compras'],
  ['tipoRetencionIsr','Tipo de Retención en ISR'], ['montoRetencionRenta','Monto Retención Renta'],
  ['isrPercibidoCompras','ISR Percibido en compras'],
  ['isc','Impuesto Selectivo al Consumo'], ['otrosImpuestos','Otros Impuesto/Tasas'],
  ['montoPropinaLegal','Monto Propina Legal'], ['formaPago','Forma de Pago'], ['estatus','Estatus'],
];

const COLS_607 = [
  ['lineas','No'], ['cliente','Cliente'], ['rncCedulaPasaporte','RNC/Cédula o Pasaporte'],
  ['ncf','Número Comprobante Fiscal'], ['ncfModificado','Número Comprobante Fiscal Modificado'],
  ['tipoIngreso','Tipo de Ingreso'], ['fechaComprobante','Fecha Comprobante'],
  ['diaComprobante','Dia Comprobante'], ['fechaRetencion','Fecha de Retención'],
  ['diaRetencion','Dia de Retención'], ['montoFacturado','Monto Facturado'],
  ['itbisFacturado','ITBIS Facturado'], ['itbisRetenidoTerceros','ITBIS Retenido por Terceros'],
  ['itbisPercibido','ITBIS Percibido'], ['retencionRentaTerceros','Retención Renta por Terceros'],
  ['isrPercibido','ISR Percibido'], ['isc','Impuesto Selectivo al Consumo'],
  ['otrosImpuestos','Otros Impuestos/Tasas'], ['montoPropinaLegal','Monto Propina Legal'],
  ['efectivo','Efectivo'], ['chequeTransferenciaDeposito','Cheque/ Transferencia/ Depósito'],
  ['tarjetaDebitoCredito','Tarjeta Débito/Crédito'], ['ventaCredito','Venta a Crédito'],
  ['bonosCertificadosRegalo','Bonos o Certificados de Regalo'],
  ['permuta','Permuta'], ['otrasFormasVentas','Otras Formas de Ventas'], ['estatus','Estatus'],
];

// Keys to exclude from TXT
const TXT_SKIP = new Set(['lineas','estatus','proveedor','cliente']);

function n(v) { return typeof v === 'number' ? v : (parseFloat(v) || 0); }
function fmt(v) { return typeof v === 'number' && v === 0 ? '' : (v ?? ''); }

function downloadXlsx(tipo, rows, periodo) {
  const cols = tipo === '607' ? COLS_607 : COLS_606;
  const headers = cols.map(c => c[1]);
  const data = [headers];
  rows.forEach((row, i) => {
    const r = cols.map(([key]) => {
      if (key === 'lineas') return String(i + 1);
      if (key === 'estatus') return '';
      const v = row[key];
      if (typeof v === 'number') return v === 0 ? '' : v;
      return v ?? '';
    });
    data.push(r);
  });
  const ws = XLSX.utils.aoa_to_sheet(data);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, tipo === '607' ? `Formato 607` : 'DIGITAR');
  XLSX.writeFile(wb, `ModeloExcel_${periodo || getYearMonth()}.xlsx`);
}

function downloadTxt(tipo, rows, periodo) {
  const cols = tipo === '607' ? COLS_607 : COLS_606;
  const txtCols = cols.filter(([key]) => !TXT_SKIP.has(key));
  const lines = rows.map(row =>
    txtCols.map(([key]) => {
      const v = row[key];
      if (typeof v === 'number') return v === 0 ? '' : v.toFixed(2);
      return v ?? '';
    }).join('|')
  );
  const content = lines.join('\r\n') + (lines.length ? '\r\n' : '');
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `${tipo}_${periodo || getYearMonth()}.txt`;
  a.click(); URL.revokeObjectURL(url);
}

function getYearMonth() {
  const d = new Date();
  return String(d.getFullYear()) + String(d.getMonth() + 1).padStart(2, '0');
}

// ── Result card ──────────────────────────────────────────────────────────────
function buildResultCard(tipo, row, rowIndex) {
  const isCompra = tipo === '606';
  const nombre = isCompra ? (row.proveedor || '') : (row.cliente || '');
  const rnc = isCompra ? (row.rncCedula || '') : (row.rncCedulaPasaporte || '');
  const ncf = row.ncf || '—';
  const fecha = row.fechaComprobante ? `${row.fechaComprobante}/${row.diaComprobante || '??'}` : '—';
  const monto = isCompra ? n(row.totalMontoFacturado) : n(row.montoFacturado);
  const itbis = n(row.itbisFacturado);
  const montoFmt = 'RD$ ' + monto.toLocaleString('es-DO', { minimumFractionDigits: 2 });
  const itbisFmt = 'RD$ ' + itbis.toLocaleString('es-DO', { minimumFractionDigits: 2 });
  const badgeLabel = tipo;
  const allRows = tipo === '606' ? results606 : results607;
  const periodo = row.fechaComprobante || getYearMonth();
  const idx = rowIndex;

  return `
  <div class="result-card">
    <div class="result-card-header">
      <h3>✓ Factura ${idx + 1} procesada</h3>
      <span class="badge">${badgeLabel}</span>
    </div>
    <div class="result-fields">
      ${nombre ? `<div class="result-field"><span class="label">${isCompra ? 'Proveedor' : 'Cliente'}</span><span class="value">${escHtml(nombre)}</span></div>` : ''}
      ${rnc ? `<div class="result-field"><span class="label">RNC/Cédula</span><span class="value">${rnc}</span></div>` : ''}
      <div class="result-field"><span class="label">NCF</span><span class="value">${ncf}</span></div>
      <div class="result-field"><span class="label">Fecha</span><span class="value">${fecha}</span></div>
      <div class="result-field"><span class="label">Monto</span><span class="value">${montoFmt}</span></div>
      <div class="result-field"><span class="label">ITBIS</span><span class="value">${itbisFmt}</span></div>
    </div>
    <div class="result-actions">
      <button class="dl-btn dl-xlsx" onclick="downloadXlsx('${tipo}', window._nalaRows${tipo}, '${periodo}')">📥 Excel ${tipo}</button>
      <button class="dl-btn dl-txt" onclick="downloadTxt('${tipo}', window._nalaRows${tipo}, '${periodo}')">📄 TXT DGII</button>
    </div>
  </div>`;
}

// Keep rows accessible from onclick
window._nalaRows606 = results606;
window._nalaRows607 = results607;

// ── File extraction ──────────────────────────────────────────────────────────
async function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function extractPdfText(file) {
  if (typeof pdfjsLib === 'undefined') return `PDF: ${file.name}`;
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= Math.min(pdf.numPages, 4); i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    text += content.items.map(s => s.str).join(' ') + '\n';
  }
  return text.trim() || `PDF: ${file.name}`;
}

// Render one PDF page to a base64 JPEG (for scanned/image-based pages).
async function renderPdfPageToImage(page) {
  const viewport = page.getViewport({ scale: 1.5 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
  return canvas.toDataURL('image/jpeg', 0.82).split(',')[1];
}

// Expand a multi-page PDF into per-page tasks (handles text and scanned PDFs).
async function expandPdfToPages(file) {
  if (typeof pdfjsLib === 'undefined') return null;
  const buf = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
  if (pdf.numPages <= 1) return null; // single page — process normally
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const text = content.items.map(s => s.str).join(' ').trim();
    const label = `${file.name} (pág. ${i}/${pdf.numPages})`;
    if (text.length >= 30) {
      // Text-based page → send as text (cheaper)
      pages.push({ kind: 'pdf', name: label, pdfText: text });
    } else {
      // Scanned / image-based page → render as JPEG and send to vision model
      const b64 = await renderPdfPageToImage(page);
      pages.push({ kind: 'img', name: label, base64: b64, mimeType: 'image/jpeg' });
    }
  }
  return pages.length ? pages : null;
}

// ── Process invoices ─────────────────────────────────────────────────────────
async function processFiles(files, modeOverride) {
  const efectMode = modeOverride || mode || '606';
  const msgs = document.getElementById('messages');

  // Expand multi-page PDFs into per-page tasks (one invoice per page)
  const tasks = [];
  for (const item of files) {
    if (item.kind === 'pdf' && item.file) {
      const pages = await expandPdfToPages(item.file);
      if (pages) {
        pages.forEach(p => tasks.push(p)); // preserve kind, base64, mimeType for scanned pages
      } else {
        tasks.push(item);
      }
    } else {
      tasks.push(item);
    }
  }

  // Progress bubble
  const progD = document.createElement('div');
  progD.className = 'msg bot';
  progD.innerHTML = `<div class="msg-av">N</div><div class="bubble"><div id="prog-content">⏳ Preparando ${tasks.length} factura(s)…</div><div class="progress-bar-track"><div class="progress-bar-fill" id="prog-bar" style="width:0%"></div></div></div>`;
  msgs.appendChild(progD);
  msgs.scrollTop = msgs.scrollHeight;

  const results = [];
  for (let i = 0; i < tasks.length; i++) {
    const item = tasks[i];
    document.getElementById('prog-content').textContent = `⏳ Procesando ${i + 1}/${tasks.length}: ${item.name}`;
    document.getElementById('prog-bar').style.width = `${Math.round(i / tasks.length * 100)}%`;

    try {
      let payload = { mode: efectMode };
      if (item.pdfText) {
        // Pre-extracted text (text-based PDF page)
        payload.pdfText = item.pdfText;
      } else if (item.base64) {
        // Pre-rendered image (scanned PDF page)
        payload.base64 = item.base64;
        payload.mimeType = item.mimeType || 'image/jpeg';
      } else if (item.kind === 'img') {
        // User-uploaded image file
        const b64 = await fileToBase64(item.file);
        payload.base64 = b64.split(',')[1];
        payload.mimeType = item.file.type;
      } else {
        // Single-page PDF — extract text
        payload.pdfText = await extractPdfText(item.file);
      }

      const res = await fetch('/api/nala/analyze', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error(await res.text());
      const { data } = await res.json();
      results.push({ data, name: item.name });
    } catch (e) {
      results.push({ error: e.message, name: item.name });
    }
  }

  document.getElementById('prog-bar').style.width = '100%';
  document.getElementById('prog-content').textContent = `✓ ${results.length} factura(s) procesadas`;

  // Remove progress, show results
  setTimeout(() => {
    progD.remove();

    const goodResults = results.filter(r => !r.error);
    const badResults = results.filter(r => r.error);

    // Accumulate all good results first
    goodResults.forEach(r => {
      if (efectMode === '607') results607.push(r.data);
      else results606.push(r.data);
    });

    const tipo = efectMode === '607' ? '607' : '606';
    const periodo = goodResults[0]?.data?.fechaComprobante || getYearMonth();

    if (goodResults.length <= 5) {
      // Show individual result cards for small batches
      goodResults.forEach((r, idx) => {
        const rowIndex = (efectMode === '607' ? results607 : results606).length - goodResults.length + idx;
        const cardHtml = buildResultCard(efectMode, r.data, rowIndex);
        const d = document.createElement('div');
        d.className = 'msg bot';
        d.innerHTML = `<div class="msg-av">N</div><div>${cardHtml}</div>`;
        msgs.appendChild(d);
      });
    }

    if (badResults.length) {
      // Cap error list at 10 to avoid flooding
      badResults.slice(0, 10).forEach(r => {
        const d = document.createElement('div');
        d.className = 'msg bot';
        d.innerHTML = `<div class="msg-av">N</div><div class="bubble"><div class="error-msg">⚠️ Error en "${escHtml(r.name)}": ${escHtml(r.error)}</div></div>`;
        msgs.appendChild(d);
      });
      if (badResults.length > 10) {
        const d = document.createElement('div');
        d.className = 'msg bot';
        d.innerHTML = `<div class="msg-av">N</div><div class="bubble"><div class="error-msg">… y ${badResults.length - 10} error(es) más</div></div>`;
        msgs.appendChild(d);
      }
    }

    if (goodResults.length > 0) {
      const d = document.createElement('div');
      d.className = 'msg bot';
      d.innerHTML = `<div class="msg-av">N</div><div class="bubble">
        ✅ <strong>${goodResults.length} factura(s) procesadas</strong>${badResults.length ? ` · ⚠️ ${badResults.length} error(es)` : ''} — ${tipo}<br>
        <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
          <button class="dl-btn dl-xlsx" style="flex:none;padding:7px 14px" onclick="downloadXlsx('${tipo}', window._nalaRows${tipo}, '${periodo}')">📥 Descargar Excel ${tipo}</button>
          <button class="dl-btn dl-txt" style="flex:none;padding:7px 14px" onclick="downloadTxt('${tipo}', window._nalaRows${tipo}, '${periodo}')">📄 Descargar TXT DGII</button>
        </div>
      </div>`;
      msgs.appendChild(d);
    }

    msgs.scrollTop = msgs.scrollHeight;
  }, 400);
}

// ── Chat (text only) ─────────────────────────────────────────────────────────
async function sendChat(text) {
  showTyping();
  chatHistory.push({ role: 'user', content: text });
  try {
    const res = await fetch('/api/nala/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: chatHistory })
    });
    hideTyping();
    const data = await res.json();
    const reply = data.reply || data.error || 'Error';
    appendMsg('bot', reply);
    chatHistory.push({ role: 'assistant', content: reply });
  } catch (e) {
    hideTyping();
    appendMsg('bot', '⚠️ Error de conexión: ' + e.message);
  }
}

// ── Main send handler ────────────────────────────────────────────────────────
async function handleSend() {
  if (busy) return;
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  const files = [...pendingFiles];

  if (!text && !files.length) return;

  busy = true;
  document.getElementById('send-btn').disabled = true;

  // Show user message
  if (text || files.length) {
    let displayText = text;
    if (files.length) displayText += (text ? '\n' : '') + files.map(f => `📎 ${f.name}`).join('\n');
    appendMsg('user', displayText);
  }

  input.value = '';
  input.style.height = 'auto';
  clearFiles();

  // Remove welcome card if present
  const welcome = document.querySelector('.messages > div');
  if (welcome && welcome.querySelector('.welcome')) welcome.remove();

  if (files.length) {
    await processFiles(files, mode);
  } else if (text) {
    await sendChat(text);
  }

  busy = false;
  document.getElementById('send-btn').disabled = false;
  document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
}

// ── Auto-resize textarea ─────────────────────────────────────────────────────
const inp = document.getElementById('chat-input');
inp.addEventListener('input', () => {
  inp.style.height = 'auto';
  inp.style.height = Math.min(inp.scrollHeight, 80) + 'px';
});
inp.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});

// ── Drag & Drop ──────────────────────────────────────────────────────────────
document.addEventListener('dragover', e => {
  e.preventDefault();
  document.getElementById('drag-overlay').classList.add('show');
});
document.addEventListener('dragleave', e => {
  if (!e.relatedTarget || e.relatedTarget === document.documentElement)
    document.getElementById('drag-overlay').classList.remove('show');
});
document.addEventListener('drop', e => {
  e.preventDefault();
  document.getElementById('drag-overlay').classList.remove('show');
  if (e.dataTransfer.files?.length) addFiles(e.dataTransfer.files);
});

// ── Init ─────────────────────────────────────────────────────────────────────
showWelcome();
</script>
